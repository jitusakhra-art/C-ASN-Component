<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Metal Mech Engineering - CSN Details</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, Helvetica, sans-serif;
    background: #f2f4f7;
    color: #222;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: 30px auto;
    background: #ffffff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(0,0,0,0.15);
}

.header {
    background: #1f4e78;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

.header h1 {
    margin: 0;
    font-size: 26px;
}

.header p {
    margin: 7px 0 0;
    font-size: 15px;
}

.section-title {
    background: #d9eaf7;
    color: #111;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    padding: 12px;
    border-bottom: 2px solid #1f4e78;
}

.details {
    padding: 18px;
}

.row {
    display: flex;
    border-bottom: 1px solid #ddd;
    padding: 12px 5px;
}

.label {
    width: 42%;
    font-weight: bold;
    color: #444;
}

.value {
    width: 58%;
    font-weight: 600;
    word-break: break-word;
}

.footer {
    text-align: center;
    padding: 16px;
    background: #f5f5f5;
    font-size: 13px;
    color: #666;
}

@media (max-width: 500px) {
    body {
        padding: 10px;
    }

    .container {
        margin: 10px auto;
    }

    .header h1 {
        font-size: 22px;
    }

    .row {
        display: block;
    }

    .label,
    .value {
        width: 100%;
    }

    .value {
        margin-top: 5px;
    }
}
</style>

</head>

<body>

<div class="container">

    <div class="header">
        <h1>Metal Mech Engineering</h1>
        <p>Material Traceability Details / Documents</p>
    </div>

    <div class="section-title">
        CSN-Details
    </div>

    <div class="details">

        <div class="row">
            <div class="label">Travel Card No</div>
            <div class="value">T-968</div>
        </div>

        <div class="row">
            <div class="label">Item Name</div>
            <div class="value">MM EX RD3N2N REDUCER</div>
        </div>

        <div class="row">
            <div class="label">Assembly No</div>
            <div class="value">CEX260608-21</div>
        </div>

        <div class="row">
            <div class="label">CMN No</div>
            <div class="value">C26031801-01</div>
        </div>

        <div class="row">
            <div class="label">RMN No</div>
            <div class="value">R251122-03</div>
        </div>

        <div class="row">
            <div class="label">MTC No</div>
            <div class="value">981</div>
        </div>

        <div class="row">
            <div class="label">Heat No</div>
            <div class="value">4</div>
        </div>

        <div class="row">
            <div class="label">Work Order</div>
            <div class="value">26100020</div>
        </div>

    </div>

    <div class="footer">
        Metal Mech Engineering<br>
        Material Traceability System
    </div>

</div>

</body>
</html>
